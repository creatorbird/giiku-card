<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
  <meta name="description" content="HIRO（ヒロ）のプロフィール">
  <title>HIRO | Profile</title>
  <style>
    /* ========== デザイントークン ========== */
    :root {
      --bg: #f4f7f5;
      --ink: #15211b;
      --sub: #56665e;
      --line: #15211b;
      --surface: #ffffff;
      --cell0: #e2e8e4;
      --cell1: #b7e8c0;
      --cell2: #6fd08a;
      --cell3: #34a853;
      --cell4: #1e7b3c;
      --press: #e6f5ea;
      --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
      --font-name: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", var(--font);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101613;
        --ink: #eef5f0;
        --sub: #9db0a5;
        --line: #b9c9bf;
        --surface: #18211c;
        --cell0: #1f2a24;
        --cell1: #1d4a2c;
        --cell2: #2a7a45;
        --cell3: #3fb565;
        --cell4: #74e095;
        --press: #1f3327;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.75;
      -webkit-tap-highlight-color: transparent;
    }

    /* 画面ぴったりの高さで縦に並べ、余白は内側で吸収する（下に空白が出ない） */
    main {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 440px;
      margin: 0 auto;
      padding: 28px 24px 20px;
    }

    /* ========== 主役：草（コントリビューション）で描いた H ========== */
    .grass {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(7, auto);
      gap: 5px;
      max-width: 300px;
      margin-bottom: 26px;
    }

    .grass i {
      aspect-ratio: 1;
      border-radius: 4px;
      background: var(--cell0);
      animation: grow 0.45s ease-out both;
      animation-delay: var(--d);
    }

    .grass .l1 { --c: var(--cell1); }
    .grass .l2 { --c: var(--cell2); }
    .grass .l3 { --c: var(--cell3); }
    .grass .l4 { --c: var(--cell4); }
    .grass .l0 { --c: var(--cell0); }

    .grass i { background: var(--c); }

    /* 1マスずつ「積み上がる」演出（ページを開いたときの1回だけ） */
    @keyframes grow {
      from { background: var(--cell0); transform: scale(0.6); }
      to   { background: var(--c); transform: scale(1); }
    }

    /* ========== 名前・自己紹介 ========== */
    .name {
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-family: var(--font-name);
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: 0.01em;
    }

    .name small {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      color: var(--sub);
      letter-spacing: 0.15em;
    }

    .bio {
      margin: 10px 0 26px;
      font-size: 1rem;
      color: var(--sub);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    /* ========== ボタン：押し込めるキーのような手ざわり ========== */
    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 0 18px;
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 5px 0 var(--line);
      color: var(--ink);
      text-decoration: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    }

    .link-btn:active {
      transform: translateY(5px);
      box-shadow: 0 0 0 var(--line);
      background: var(--press);
    }

    @media (hover: hover) {
      .link-btn:hover { background: var(--press); }
    }

    .link-btn:focus-visible {
      outline: 3px solid var(--cell3);
      outline-offset: 4px;
    }

    .link-btn .icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--ink);
      color: var(--bg);
    }

    .link-btn .icon svg { width: 20px; height: 20px; fill: currentColor; }

    .link-btn .label {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .link-btn .handle {
      display: block;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--sub);
    }

    .link-btn .arrow {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footer {
      margin-top: auto;
      padding-top: 24px;
      font-size: 0.75rem;
      color: var(--sub);
    }

    @media (max-width: 340px) {
      main { padding-left: 18px; padding-right: 18px; }
      .name { font-size: 2.3rem; }
      .grass { gap: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
